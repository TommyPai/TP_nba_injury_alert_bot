name: Daily free agent watchlist

on:
  schedule:
    - cron: "0 21 * * *"   # 每天 21:00 UTC = 墨爾本早上 8 點(夏令時間)
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install espn_api
        run: python3 -m pip install --quiet espn_api || python3 -m pip install --quiet --break-system-packages espn_api

      - name: Send daily watchlist
        run: python3 daily_watch.py
