name: NBA injury alert

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 最短 5 分鐘,尖峰時段可能延遲數分鐘
  workflow_dispatch:
    inputs:
      test:
        description: "只送一則測試通知"
        type: boolean
        default: false

permissions:
  contents: write            # 用來把 state.json 存回 repo

concurrency:
  group: nba-injury-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MY_PLAYERS: ${{ vars.MY_PLAYERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # 排隊等前一次跑完後,取分支最新版本(預設會用觸發當下的舊版本)

      - name: Test notification
        if: ${{ inputs.test }}
        run: python3 nba_injury_alert.py --test-notify

      - name: Check injuries
        if: ${{ !inputs.test }}
        run: python3 nba_injury_alert.py --once

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          # 先保存這次的結果,再對齊遠端最新版後放回去;推送失敗(有別次執行剛推過)就重試
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PATHS="state.json"
          git add $PATHS
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          tmp=$(mktemp -d) && cp -r --parents $PATHS "$tmp"
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            rm -rf $PATHS && cp -r "$tmp"/. .
            git add $PATHS
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "update state" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
