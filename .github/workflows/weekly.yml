name: Weekly streaming report

on:
  schedule:
    - cron: "0 21 * * 0"   # 週日 21:00 UTC = 墨爾本週一早上 8 點(夏令時間)
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Send weekly streaming report
        run: python3 weekly_stream.py
