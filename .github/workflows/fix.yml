name: Injury fix

# 由 Cloudflare 門鈴觸發(你在 Telegram 點 /fix 指令時):把 OUT 的人移到 IR 並撿人,不放任何人
on:
  workflow_dispatch:
    inputs:
      out:
        description: "移到 IR 的球員 ID"
        required: true
      add:
        description: "要撿的球員 ID"
        required: true

concurrency:
  group: injury-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      OUT_ID: ${{ inputs.out }}
      ADD_ID: ${{ inputs.add }}
    steps:
      - uses: actions/checkout@v4
      - name: Install espn_api
        run: python3 -m pip install --quiet espn_api || python3 -m pip install --quiet --break-system-packages espn_api

      - name: Move to IR and add
        run: python3 auto_fix.py --run "$OUT_ID" "$ADD_ID"
